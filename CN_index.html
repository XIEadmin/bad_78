<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄验证</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --text: #e8e8e8;
            --text-dim: #9a9a9a;
            --text-faint: #6b6b6b;
            --accent: #ffa500;
            --accent-hover: #ffb733;
            --border: rgba(255, 255, 255, 0.18);
            --border-hover: rgba(255, 255, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px 60px;
            -webkit-font-smoothing: antialiased;
            line-height: 1.65;
        }

        .panel {
            width: 100%;
            max-width: 780px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 48px 40px 56px;
            text-align: center;
            position: relative;
        }

        /* ---------- 语言切换 ---------- */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-decoration: none;
            transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
        }

        .lang-switch:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 165, 0, 0.08);
        }

        .lang-switch svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Logo ---------- */
        .logo {
            display: inline-flex;
            align-items: center;
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
            user-select: none;
            margin-bottom: 32px;
        }

        .logo .white {
            color: #ffffff;
        }

        .logo .box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e5a50a;
            color: #000000;
            padding: 0 10px;
            border-radius: 5px;
            margin-left: 2px;
            height: 1.15em;
        }

        /* ---------- 顶部 ---------- */
        .panel h1 {
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #ffffff;
            margin-bottom: 28px;
            line-height: 1.3;
        }

        /* ---------- 小标签按钮 ---------- */
        .pill {
            display: inline-block;
            padding: 9px 22px;
            border-radius: 999px;
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 26px;
            text-decoration: none;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        .pill:hover {
            border-color: var(--border-hover);
        }

        /* ---------- 正文段落 ---------- */
        .notice-text {
            font-size: 15.5px;
            line-height: 1.9;
            color: #d6d6d6;
            max-width: 640px;
            margin: 0 auto 14px;
        }

        .notice-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .notice-text a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* ---------- 主要按钮 ---------- */
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 34px 0 44px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 330px;
            padding: 17px 24px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.25s ease, background 0.25s ease,
                color 0.25s ease, transform 0.15s ease;
        }

        .btn:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:active {
            transform: scale(0.985);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        /* ---------- 底部信息区 ---------- */
        .info {
            font-size: 14.5px;
            line-height: 1.9;
            color: #d6d6d6;
            max-width: 660px;
            margin: 0 auto;
        }

        .info p+p {
            margin-top: 18px;
        }

        .info strong {
            display: block;
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .info a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .info a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            body {
                padding: 24px 12px 40px;
            }

            .panel {
                padding: 34px 20px 40px;
                border-radius: 12px;
            }

            .panel h1 {
                margin-bottom: 22px;
            }

            .logo {
                font-size: 32px;
                margin-bottom: 24px;
            }

            .lang-switch {
                top: 14px;
                right: 16px;
                padding: 6px 11px;
                font-size: 11.5px;
            }

            .notice-text {
                font-size: 14.5px;
            }

            .btn {
                padding: 15px 20px;
                font-size: 14px;
            }

            .info {
                font-size: 13.5px;
            }

            .info strong {
                font-size: 14.5px;
            }
        }
    </style>
</head>

<body>
