<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码验证</title>
    <style>
        :root {
            --bg: #0d0507;
            --card-bg: rgba(255, 45, 85, 0.05);
            --card-border: rgba(255, 77, 109, 0.22);
            --accent: #ff2d55;
            --accent-hover: #ff4d6d;
            --text: #ffffff;
            --text-dim: #b3949b;
            --text-faint: #6d5057;
            --error: #ff6b85;
            --success: #00e0a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 45, 85, .22), transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(139, 10, 26, .35), transparent 58%);
            background-attachment: fixed;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 44px 36px 36px;
            border-radius: 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .75),
                0 0 60px rgba(255, 45, 85, .10),
                inset 0 1px 0 rgba(255, 140, 160, .12);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            text-align: center;
            animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.96);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .lock {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ff2d55, #8b0a1a);
            box-shadow: 0 0 0 0 rgba(255, 45, 85, .55);
            animation: pulse 2.4s ease-out infinite;
            user-select: none;
        }

        .lock svg {
            width: 34px;
            height: 34px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 45, 85, .50);
            }

            70% {
                box-shadow: 0 0 0 22px rgba(255, 45, 85, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 45, 85, 0);
            }
        }

        .lock.unlocked {
            background: linear-gradient(145deg, #00e0a1, #00b4ff);
            animation: none;
            box-shadow: 0 0 46px rgba(0, 224, 161, .55);
        }

        .lock.error {
            background: linear-gradient(145deg, #ff6b85, #c2001f);
            animation: none;
            box-shadow: 0 0 46px rgba(255, 45, 85, .65);
        }

        .card h1 {
            font-size: clamp(20px, 4.6vw, 26px);
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, #ff6b85 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .card .desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .input-wrap input {
            width: 100%;
            padding: 16px 48px 16px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 77, 109, .30);
            background: rgba(0, 0, 0, .35);
            color: var(--text);
            font-family: inherit;
            font-size: 15.5px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .input-wrap input::placeholder {
            color: var(--text-faint);
        }

        .input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 45, 85, .15);
        }

        .input-wrap input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 107, 133, .18);
        }

        .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            transition: color .2s ease;
        }

        .toggle-pwd:hover {
            color: var(--text-dim);
        }

        .toggle-pwd svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .message {
            font-size: 13.5px;
            min-height: 20px;
            margin-bottom: 18px;
            color: var(--text-faint);
            transition: color .25s ease;
        }

        .message.error {
            color: var(--error);
        }

        .message.success {
            color: var(--success);
        }

        .submit-btn {
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(145deg, #ff2d55, #a3001c);
            box-shadow: 0 10px 30px rgba(255, 45, 85, .38);
            transition: transform .18s ease, box-shadow .25s ease, background .25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #ff4d6d, #c2001f);
            box-shadow: 0 16px 44px rgba(255, 45, 85, .60);
        }

        .submit-btn:active {
            transform: scale(.98);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {
            .card {
                padding: 34px 22px 26px;
                border-radius: 18px;
            }

            .lock {
                width: 66px;
                height: 66px;
                margin-bottom: 18px;
            }

            .lock svg {
                width: 28px;
                height: 28px;
            }

            .input-wrap input {
                padding: 14px 42px 14px 15px;
                font-size: 15px;
            }

            .submit-btn {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card" id="pwd-card">
        <div class="lock" id="lock-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1>Restricted Access</h1>
        <p class="desc">Please enter the password to continue.</p>

        <div class="input-wrap">
            <input type="password" id="pwd-input" placeholder="Enter password" autocomplete="off" autofocus>
            <button type="button" class="toggle-pwd" id="toggle-pwd" aria-label="Show password">
                <svg viewBox="0 0 24 24" id="eye-icon">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <p class="message" id="message"></p>

        <button type="button" class="submit-btn" id="submit-btn">Verify</button>
    </div>

    <script>
        (function () {
            const PWD_HASH = 'b84340b0d4b536bdf4375506888365ae2d49a196fb54fbe75f3f8a39d4f1a04e';
            const SUCCESS_URL = 'https://www.pornhub.com';

            const input = document.getElementById('pwd-input');
            const toggle = document.getElementById('toggle-pwd');
            const submit = document.getElementById('submit-btn');
            const message = document.getElementById('message');
            const lockIcon = document.getElementById('lock-icon');
            const eyeIcon = document.getElementById('eye-icon');

            let loading = false;

            async function sha256(text) {
                const encoder = new TextEncoder();
                const data = encoder.encode(text);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            toggle.addEventListener('click', function () {
                if (input.type === 'password') {
                    input.type = 'text';
                    eyeIcon.innerHTML =
                        '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>' +
                        '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>' +
                        '<line x1="1" y1="1" x2="23" y2="23"></line>';
                } else {
                    input.type = 'password';
                    eyeIcon.innerHTML =
                        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>' +
                        '<circle cx="12" cy="12" r="3"></circle>';
                }
            });

            async function verify() {
                if (loading) return;

                const value = input.value.trim();

                if (!value) {
                    input.classList.add('error');
                    message.textContent = 'Please enter a password.';
                    message.className = 'message error';
                    return;
                }

                input.classList.remove('error');

                let inputHash;
                try {
                    inputHash = await sha256(value);
                } catch (err) {
                    console.error('[pwd] 哈希计算失败:', err);
                    message.textContent = 'Hash error. Please use a modern browser over HTTPS or localhost.';
                    message.className = 'message error';
                    return;
                }

                console.log('[pwd] 输入哈希:', inputHash);

                if (inputHash === PWD_HASH.toLowerCase()) {
                    loading = true;
                    submit.disabled = true;
                    submit.innerHTML = '<span class="loading"></span>Verifying…';

                    lockIcon.classList.add('unlocked');
                    lockIcon.innerHTML =
                        '<svg viewBox="0 0 24 24">' +
                        '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>' +
                        '<path d="M7 11V7a5 5 0 0 1 9.9-1"></path>' +
                        '</svg>';

                    message.textContent = 'Access granted. Redirecting…';
                    message.className = 'message success';

                    setTimeout(function () {
                        window.location.href = SUCCESS_URL;
                    }, 900);

                } else {
                    lockIcon.classList.add('error');
                    input.classList.add('error');
                    message.textContent = 'Incorrect password. Please try again.';
                    message.className = 'message error';

                    input.value = '';
                    input.focus();

                    input.style.animation = 'none';
                    input.offsetHeight;
                    input.style.animation = 'shake .4s ease';
                    setTimeout(function () {
                        input.style.animation = '';
                        lockIcon.classList.remove('error');
                    }, 1200);
                }
            }

            submit.addEventListener('click', verify);

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    verify();
                }
            });

            input.addEventListener('input', function () {
                input.classList.remove('error');
                if (message.className.indexOf('error') !== -1) {
                    message.textContent = '';
                    message.className = 'message';
                }
            });

            const style = document.createElement('style');
            style.textContent =
                '@keyframes shake {' +
                '0%, 100% { transform: translateX(0); }' +
                '20% { transform: translateX(-8px); }' +
                '40% { transform: translateX(8px); }' +
                '60% { transform: translateX(-5px); }' +
                '80% { transform: translateX(5px); }' +
                '}';
            document.head.appendChild(style);
        })();
    </script>
</body>

</html>
